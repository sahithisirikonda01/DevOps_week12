apiVersion: apps/v1
kind: Deployment

metadata:
  name: seleniumtestdemoapp1-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: seleniumtestdemoapp

  template:
    metadata:
      labels:
        app: seleniumtestdemoapp

    spec:
      containers:
        - name: seleniumtestdemoapp

          image: sahithisirikonda01/week12-registration:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 5000